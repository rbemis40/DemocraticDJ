services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8081:8081"
  cluster:
    build:
      context: .
      dockerfile: cluster/Dockerfile
    ports:
      - "8082:8082"
      - "8083:8083"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
  gameserver:
    build:
      context: .
      dockerfile: game_server/Dockerfile
    profiles: ["gameserver"]